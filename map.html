<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>EFF AR Platform</title>

<link rel="stylesheet" href="assets/css/bootstrap.min.css">
<link rel="stylesheet" href="assets/css/bootstrap-icons.min.css">
<link rel="stylesheet" href="assets/css/style.css">
<script src="assets/js/aframe.min.js"></script>
<script src="assets/js/mindar-image-aframe.prod.js"></script>
<style>

#ar-video {
    position: fixed;
    inset: 0;
    z-index: 3000;
    display: none;
    align-items: center;
    justify-content: center;
    pointer-events: none;
}

#ar-video.show {
    display: flex;
}

.video-content {
    width: min(94vw, 700px);
    padding: 10px;
    pointer-events: auto;
}

.video-card {
    background: rgba(0,0,0,.82);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 20px;
    padding: 10px;
    box-shadow:
        0 15px 40px rgba(0,0,0,.6);
}

.video-container {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 5;
    background: #000;
    border-radius: 15px;
    overflow: hidden;
}

.video-container video {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
    background: #000;
}

.video-counter {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 10;
    color: white;
    background: rgba(0,0,0,.75);
    padding: 5px 10px;
    border-radius: 20px;
    font-size: .8rem;
}

.video-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 45px;
    height: 45px;
    border: 0;
    border-radius: 50%;
    background: rgba(0,0,0,.7);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 20;
    font-size: 1.3rem;
}

.video-arrow:hover {
    background: #e60000;
}

.video-prev {
    left: 10px;
}

.video-next {
    right: 10px;
}

.video-title {
    color: white;
    text-align: center;
    font-size: 1.05rem;
    font-weight: 600;
    margin-top: 12px;
}

.video-dots {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 7px;
    margin-top: 10px;
}

.video-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(255,255,255,.4);
    cursor: pointer;
    transition: .2s;
}

.video-dot.active {
    width: 22px;
    border-radius: 10px;
    background: #e60000;
}

@media (max-width: 576px) {
    .video-content {
        width: 95vw;
        padding: 7px;
    }

    .video-card {
        padding:
        border-radius: 16px;
    }

    .video-arrow {
        width: 40px;
        height: 40px;
        font-size: 1.1rem;
    }

}

@media (
    max-height: 500px
) and (
    orientation: landscape
) {
    .video-content {
        width: min(75vw, 650px);
    }
    .video-container {
        aspect-ratio: 16 / 8;
    }
}

@media (min-width: 992px) {
    .video-content {
        width: min(65vw, 700px);
    }
}

</style>
</head>
<body>

<div id="custom-loading">
    <img src="assets/images/eff.png"  class="loading-photo" alt="EFF">
    <div class="loading-text">
        Loading AR Experience...
    </div>
</div>

<div id="example-scanning-overlay" class="hidden">
    <div class="inner">
        <img src="assets/images/eff.png" alt="Scan EFF logo">
        <div class="scanline"></div>
    </div>
</div>

<div class="bg-danger text-center" id="status">>Explore EFF AR Platform</div>

<div id="ar-video">
    <div class="video-content">
        <div class="video-card">
            <div class="video-container">
                <video id="arVideo" playsinline controls preload="metadata">
                    <source id="videoSource" src="" type="video/mp4">
                    Your browser does not support video.
                </video>
                <div id="videoCounter" class="video-counter">
                    1 / 3
                </div>
                <button id="videoPrev" class="video-arrow video-prev" type="button">
                    <i class="bi bi-chevron-left"></i>
                </button>
                <button id="videoNext" class="video-arrow video-next" type="button">
                    <i class="bi bi-chevron-right"></i>
                </button>
            </div>
            <div id="videoTitle" class="video-title">
                EFF Video 1
            </div>
            <div id="videoDots" class="video-dots"></div>
        </div>
    </div>
</div>

<a-scene mindar-image="imageTargetSrc: parties.mind; uiLoading: #custom-loading; uiScanning: #example-scanning-overlay;" embedded xr-mode-ui="enabled:false" device-orientation-permission-ui="enabled:false" color-space="sRGB" renderer="colorManagement:true">
    
    <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

    <a-entity mindar-image-target="targetIndex:0">
    </a-entity>
    
    <a-entity mindar-image-target="targetIndex:3">
    </a-entity>
</a-scene>

<script src="assets/js/data.js"></script>
<script>

// 1. Grab ALL image target components inside your A-Scene
const allTargets = document.querySelectorAll("[mindar-image-target]");

const arVideo = document.querySelector("#arVideo");
const videoSource = document.querySelector("#videoSource");
const videoAR = document.querySelector("#ar-video");
const videoTitle = document.querySelector("#videoTitle");
const videoCounter = document.querySelector("#videoCounter");
const videoDots = document.querySelector("#videoDots");
const status = document.querySelector("#status");

// Global tracks to manage our dynamic playlists
let activeVideoPlaylist = [];
let currentVideoIndex = 0;

/**
 * Builds the pagination dots dynamically based on the current target's playlist length
 */
function buildVideoPaginationControls() {
    videoDots.innerHTML = ""; // Clear old dots out from previous targets
    
    if (!activeVideoPlaylist || activeVideoPlaylist.length === 0) return;

    activeVideoPlaylist.forEach((video, index) => {
        const dot = document.createElement("div");
        dot.className = "video-dot";
        if (index === currentVideoIndex) {
            dot.classList.add("active");
        }
        dot.addEventListener("click", () => {
            currentVideoIndex = index;
            renderActiveVideo();
        });
        videoDots.appendChild(dot);
    });
}

/**
 * Loads the active video file path straight into the HTML5 video engine structures
 */
function renderActiveVideo() {
    if (!activeVideoPlaylist || activeVideoPlaylist.length === 0) return;
    
    const videoData = activeVideoPlaylist[currentVideoIndex];
    
    arVideo.pause();
    videoSource.src = videoData.src;
    arVideo.load(); // Forces HTML layer to read the new source file immediately
    
    // Inject metadata text
    videoTitle.textContent = videoData.title;
    videoCounter.textContent = `${currentVideoIndex + 1} / ${activeVideoPlaylist.length}`;
    
    // Refresh dot active highlight statuses
    document.querySelectorAll(".video-dot").forEach((dot, index) => {
        dot.classList.toggle("active", index === currentVideoIndex);
    });
}

// VIDEO CONTROLS CORE INTERFACES
document.querySelector("#videoNext").addEventListener("click", () => {
    if (activeVideoPlaylist.length === 0) return;
    currentVideoIndex++;
    if (currentVideoIndex >= activeVideoPlaylist.length) {
        currentVideoIndex = 0;
    }
    renderActiveVideo();
});

document.querySelector("#videoPrev").addEventListener("click", () => {
    if (activeVideoPlaylist.length === 0) return;
    currentVideoIndex--;
    if (currentVideoIndex < 0) {
        currentVideoIndex = activeVideoPlaylist.length - 1;
    }
    renderActiveVideo();
});

// CORE INTERACTION LOOP ENGINE FOR TARGET DETECTIONS
allTargets.forEach((target) => {
    target.addEventListener("targetFound", () => {
        const targetAttr = target.getAttribute("mindar-image-target");
        
        // FIX 1: Extract ONLY the first index position text string from regex match array matches
        const indexMatch = targetAttr.match(/\d+/);
        const targetIndexKey = indexMatch ? indexMatch[0] : null; // Added [0] here to extract the actual number string
        
        console.log("SUCCESSFULLY READ TARGET INDEX KEY:", targetIndexKey);

        // Safely extract the valid video array dictionary elements matching data.js
        if (targetIndexKey && typeof AR_MEDIA_DATABASE !== 'undefined' && AR_MEDIA_DATABASE[targetIndexKey] && AR_MEDIA_DATABASE[targetIndexKey].videos) {
            activeVideoPlaylist = AR_MEDIA_DATABASE[targetIndexKey].videos;
        } else {
            console.warn(`Could not find a valid matching playlist layout key entry inside data.js for index id: ${targetIndexKey}`);
            activeVideoPlaylist = [];
        }

        if (activeVideoPlaylist.length > 0) {
            currentVideoIndex = 0;
            buildVideoPaginationControls();
            renderActiveVideo();
            
            videoAR.classList.add("show");
            if (status) status.style.display = "block";
        }
    });

    target.addEventListener("targetLost", () => {
        console.log("CAMERA TRACKING BROKEN - FLUSHING INTERACTIVE VIDEO AUDIO WRAPPERS");
        
        videoAR.classList.remove("show");
        
        // Clean cleanup cycles to prevent sound bleed over issues
        arVideo.pause();
        arVideo.currentTime = 0;
        
        if (status) status.style.display = "none";
    });
});

// FIX 2: Default initialization block call routine setup
// This creates placeholder content values on application execution so things won't jump out of place layout-wise
if (typeof AR_MEDIA_DATABASE !== 'undefined' && AR_MEDIA_DATABASE["3"] && AR_MEDIA_DATABASE["3"].videos) {
    activeVideoPlaylist = AR_MEDIA_DATABASE["3"].videos;
    buildVideoPaginationControls();
    renderActiveVideo();
}

</script>
</body>

</html>
